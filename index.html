<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Duo</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
      color: white;
      background:
        radial-gradient(circle at 15% 20%, rgba(105, 80, 255, .25), transparent 30%),
        radial-gradient(circle at 85% 10%, rgba(0, 210, 255, .18), transparent 30%),
        radial-gradient(circle at 50% 100%, rgba(255, 0, 153, .12), transparent 35%),
        #080b16;
    }

    .hidden {
      display: none !important;
    }

    /* LOGIN */

    #loginPage {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: min(430px, 100%);
      padding: 40px;
      border-radius: 28px;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.12);
      backdrop-filter: blur(25px);
      box-shadow: 0 25px 80px rgba(0,0,0,.45);
    }

    .logo {
      text-align: center;
      font-size: 42px;
      margin-bottom: 10px;
    }

    .login-box h1 {
      text-align: center;
      font-size: 32px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #aeb4c7;
      margin-bottom: 30px;
    }

    input {
      width: 100%;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.07);
      color: white;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #7c6cff;
    }

    button {
      border: none;
      cursor: pointer;
      color: white;
      font-weight: bold;
    }

    .primary-btn {
      width: 100%;
      padding: 15px;
      border-radius: 14px;
      background: linear-gradient(135deg, #7567ff, #9b5cff);
      font-size: 16px;
      box-shadow: 0 10px 30px rgba(117,103,255,.3);
    }

    #loginMessage {
      text-align: center;
      color: #ff8b8b;
      margin-top: 15px;
      min-height: 20px;
    }

    /* DASHBOARD */

    .dashboard {
      width: min(1200px, 94%);
      margin: auto;
      padding: 35px 0 60px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 30px;
    }

    .brand h1 {
      font-size: clamp(30px, 5vw, 48px);
    }

    .brand p {
      color: #9ea6bc;
      margin-top: 6px;
    }

    .logout {
      padding: 11px 18px;
      border-radius: 12px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.12);
    }

    .hero {
      padding: 30px;
      border-radius: 28px;
      background: linear-gradient(
        135deg,
        rgba(117,103,255,.18),
        rgba(0,210,255,.08)
      );
      border: 1px solid rgba(255,255,255,.1);
      margin-bottom: 25px;
    }

    .hero h2 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .hero p {
      color: #aeb4c7;
    }

    .grid {
      display: grid;
      grid-template-columns: 1.4fr .8fr;
      gap: 22px;
    }

    .card {
      padding: 25px;
      border-radius: 25px;
      background: rgba(255,255,255,.055);
      border: 1px solid rgba(255,255,255,.1);
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 60px rgba(0,0,0,.2);
    }

    .card h3 {
      margin-bottom: 20px;
      font-size: 20px;
    }

    .progress-wrap {
      margin-bottom: 25px;
    }

    .progress-top {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .progress-number {
      font-weight: bold;
    }

    .progress-bar {
      width: 100%;
      height: 11px;
      background: rgba(255,255,255,.08);
      border-radius: 20px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: 20px;
      background: linear-gradient(90deg, #7567ff, #00d9ff);
      transition: width .4s ease;
    }

    .activity {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 16px;
      margin-bottom: 12px;
      border-radius: 17px;
      background: rgba(255,255,255,.045);
      border: 1px solid rgba(255,255,255,.07);
      transition: .2s;
    }

    .activity:hover {
      transform: translateY(-2px);
      background: rgba(255,255,255,.07);
    }

    .activity input[type="checkbox"] {
      width: 22px;
      height: 22px;
      margin: 0;
      accent-color: #7869ff;
      cursor: pointer;
    }

    .activity-info {
      flex: 1;
    }

    .activity-title {
      font-weight: bold;
    }

    .activity-desc {
      color: #8f97aa;
      font-size: 13px;
      margin-top: 4px;
    }

    .person {
      padding: 18px;
      border-radius: 18px;
      background: rgba(255,255,255,.045);
      margin-bottom: 12px;
    }

    .person-top {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .person-name {
      font-weight: bold;
    }

    .person-percent {
      color: #9e91ff;
      font-weight: bold;
    }

    .mini-bar {
      height: 8px;
      background: rgba(255,255,255,.08);
      border-radius: 10px;
      overflow: hidden;
    }

    .mini-fill {
      height: 100%;
      background: linear-gradient(90deg,#7567ff,#00d9ff);
      border-radius: 10px;
    }

    .suggestion {
      padding: 14px;
      border-left: 3px solid #7869ff;
      background: rgba(255,255,255,.04);
      border-radius: 10px;
      margin-bottom: 10px;
      color: #cbd0df;
      line-height: 1.5;
    }

    .date {
      color: #9da5ba;
      margin-bottom: 20px;
    }

    .status {
      color: #8f97aa;
      font-size: 13px;
      margin-top: 15px;
    }

    @media(max-width: 850px) {
      .grid {
        grid-template-columns: 1fr;
      }

      header {
        align-items: flex-start;
      }

      .login-box {
        padding: 30px 22px;
      }
    }

    @media(max-width: 500px) {
      .dashboard {
        width: 92%;
        padding-top: 20px;
      }

      header {
        flex-direction: column;
      }

      .logout {
        width: 100%;
      }

      .hero,
      .card {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

<!-- LOGIN -->

<section id="loginPage">
  <div class="login-box">
    <div class="logo">🤝</div>
    <h1>Daily Duo</h1>
    <p class="subtitle">Grow together. Every single day.</p>

    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <button class="primary-btn" onclick="login()">
      Login
    </button>

    <p id="loginMessage"></p>
  </div>
</section>


<!-- DASHBOARD -->

<section id="dashboardPage" class="dashboard hidden">

  <header>
    <div class="brand">
      <h1>Daily Duo ✨</h1>
      <p>Small progress every day becomes a big change.</p>
    </div>

    <button class="logout" onclick="logout()">Logout</button>
  </header>


  <div class="hero">
    <h2 id="welcome">Good evening 👋</h2>
    <p>Let's see what you accomplished today.</p>
  </div>


  <div class="grid">

    <!-- MY TRACKER -->

    <div class="card">

      <h3>Today's Activities</h3>

      <div class="date" id="todayDate"></div>

      <div class="progress-wrap">

        <div class="progress-top">
          <span>Your progress</span>
          <span class="progress-number" id="myPercent">0%</span>
        </div>

        <div class="progress-bar">
          <div class="progress-fill" id="myProgress"></div>
        </div>

      </div>

      <div id="activities"></div>

      <div class="status" id="saveStatus">
        Changes are saved automatically.
      </div>

    </div>


    <!-- SIDE -->

    <div>

      <div class="card">
        <h3>👥 Duo Progress</h3>
        <div id="peopleProgress"></div>
      </div>

      <br>

      <div class="card">
        <h3>💡 Today's Suggestions</h3>
        <div id="suggestions"></div>
      </div>

    </div>

  </div>

</section>


<script>

  /* =========================
     SUPABASE CONNECTION
     ========================= */

  const SUPABASE_URL =
    "https://lwhwlibkxhyckljhkisg.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_hMHnrci_qrlNwxzIXj-5UA_B1GtGo1t";

  const supabaseClient =
    supabase.createClient(SUPABASE_URL, SUPABASE_KEY);


  /* =========================
     ACTIVITIES
     ========================= */

  const activities = [
    {
      id: "exercise",
      title: "Exercise",
      desc: "Workout, walk, run or stretch."
    },
    {
      id: "healthy_food",
      title: "Healthy Food",
      desc: "Eat nutritious food and stay hydrated."
    },
    {
      id: "motivation",
      title: "Motivational Podcast / Video",
      desc: "Spend some time learning or getting inspired."
    },
    {
      id: "new_skill",
      title: "Study a New Skill",
      desc: "Learn something useful for your future."
    },
    {
      id: "job_apply",
      title: "Apply for Jobs",
      desc: "Take at least one step toward your career."
    },
    {
      id: "no_instagram",
      title: "No Instagram Scrolling",
      desc: "Avoid unnecessary Instagram scrolling today."
    }
  ];


  let currentUser = null;
  let currentProfile = null;


  /* =========================
     DATE
     ========================= */

  function today() {
    const d = new Date();

    const year = d.getFullYear();
    const month = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");

    return `${year}-${month}-${day}`;
  }


  /* =========================
     LOGIN
     ========================= */

  async function login() {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    const message =
      document.getElementById("loginMessage");

    message.textContent = "";

    if (!email || !password) {
      message.textContent =
        "Please enter email and password.";
      return;
    }

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

    if (error) {
      message.textContent = error.message;
      return;
    }

    currentUser = data.user;

    await loadProfile();

  }


  /* =========================
     LOAD PROFILE
     ========================= */

  async function loadProfile() {

    const { data, error } =
      await supabaseClient
        .from("profiles")
        .select("*")
        .eq("id", currentUser.id)
        .single();

    if (error) {
      alert("Profile could not be loaded.");
      console.error(error);
      return;
    }

    currentProfile = data;

    document.getElementById("loginPage")
      .classList.add("hidden");

    document.getElementById("dashboardPage")
      .classList.remove("hidden");

    document.getElementById("welcome").textContent =
      `Good evening, ${currentProfile.name} 👋`;

    document.getElementById("todayDate").textContent =
      new Date().toLocaleDateString("en-IN", {
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric"
      });

    await loadToday();

  }


  /* =========================
     LOAD TODAY
     ========================= */

  async function loadToday() {

    const { data, error } =
      await supabaseClient
        .from("daily_activity")
        .select("*")
        .eq("activity_date", today());

    if (error) {
      console.error(error);
      return;
    }

    renderActivities(data);
    renderPeople(data);

  }


  /* =========================
     RENDER ACTIVITIES
     ========================= */

  function renderActivities(rows) {

    const container =
      document.getElementById("activities");

    container.innerHTML = "";

    let completed = 0;

    activities.forEach(activity => {

      const row = rows.find(
        r =>
          r.user_id === currentUser.id &&
          r.activity_id === activity.id
      );

      const checked =
        row ? row.completed : false;

      if (checked) completed++;

      const div =
        document.createElement("div");

      div.className = "activity";

      div.innerHTML = `
        <input
          type="checkbox"
          ${checked ? "checked" : ""}
          onchange="toggleActivity('${activity.id}', this.checked)"
        >

        <div class="activity-info">
          <div class="activity-title">
            ${activity.title}
          </div>

          <div class="activity-desc">
            ${activity.desc}
          </div>
        </div>
      `;

      container.appendChild(div);

    });

    const percent =
      Math.round((completed / activities.length) * 100);

    document.getElementById("myPercent")
      .textContent = percent + "%";

    document.getElementById("myProgress")
      .style.width = percent + "%";

  }


  /* =========================
     SAVE ACTIVITY
     ========================= */

  async function toggleActivity(activityId, completed) {

    document.getElementById("saveStatus")
      .textContent = "Saving...";

    const { error } =
      await supabaseClient
        .from("daily_activity")
        .upsert(
          {
            user_id: currentUser.id,
            activity_date: today(),
            activity_id: activityId,
            completed: completed
          },
          {
            onConflict:
              "user_id,activity_date,activity_id"
          }
        );

    if (error) {

      console.error(error);

      document.getElementById("saveStatus")
        .textContent = "Could not save.";

      return;
    }

    document.getElementById("saveStatus")
      .textContent = "✓ Saved to cloud";

    await loadToday();

  }


  /* =========================
     PEOPLE PROGRESS
     ========================= */

  async function renderPeople(todayRows) {

    const { data: profiles, error } =
      await supabaseClient
        .from("profiles")
        .select("*");

    if (error) {
      console.error(error);
      return;
    }

    const container =
      document.getElementById("peopleProgress");

    container.innerHTML = "";

    profiles.forEach(profile => {

      const completed =
        todayRows.filter(
          row =>
            row.user_id === profile.id &&
            row.completed
        ).length;

      const percent =
        Math.round(
          (completed / activities.length) * 100
        );

      container.innerHTML += `

        <div class="person">

          <div class="person-top">

            <span class="person-name">
              ${profile.name}
              ${profile.id === currentUser.id ? " (You)" : ""}
            </span>

            <span class="person-percent">
              ${percent}%
            </span>

          </div>

          <div class="mini-bar">
            <div
              class="mini-fill"
              style="width:${percent}%"
            ></div>
          </div>

        </div>
      `;

    });

    generateSuggestions();

  }


  /* =========================
     SUGGESTIONS
     ========================= */

  async function generateSuggestions() {

    const { data } =
      await supabaseClient
        .from("daily_activity")
        .select("*")
        .eq("user_id", currentUser.id)
        .eq("activity_date", today());

    const completed =
      data ? data.filter(r => r.completed).map(r => r.activity_id) : [];

    const container =
      document.getElementById("suggestions");

    container.innerHTML = "";

    const missing =
      activities.filter(
        a => !completed.includes(a.id)
      );

    if (missing.length === 0) {

      container.innerHTML =
        `<div class="suggestion">
          🔥 Amazing! You completed everything today.
        </div>`;

      return;
    }

    missing.slice(0, 3).forEach(activity => {

      container.innerHTML += `
        <div class="suggestion">
          Try to complete <strong>${activity.title}</strong> today.
        </div>
      `;

    });

  }


  /* =========================
     LOGOUT
     ========================= */

  async function logout() {

    await supabaseClient.auth.signOut();

    currentUser = null;
    currentProfile = null;

    document.getElementById("dashboardPage")
      .classList.add("hidden");

    document.getElementById("loginPage")
      .classList.remove("hidden");

    document.getElementById("email").value = "";
    document.getElementById("password").value = "";

  }


  /* =========================
     AUTO LOGIN
     ========================= */

  async function checkSession() {

    const { data } =
      await supabaseClient.auth.getSession();

    if (data.session) {

      currentUser =
        data.session.user;

      await loadProfile();

    }

  }


  checkSession();

</script>

</body>
</html>
